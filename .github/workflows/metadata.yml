name: Metadata refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily, off the hour to avoid GitHub's peak-minute queueing
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r build/requirements.txt

      - name: Refresh metadata from source repos
        # Requires METADATA_REFRESH_TOKEN: a PAT with public_repo scope,
        # added as a repo secret (see BUILD-PLAN.md prerequisites). The
        # default GITHUB_TOKEN can read public repos too, but a dedicated
        # token keeps this workflow's rate-limit budget separate from every
        # other workflow using GITHUB_TOKEN in the same run window.
        #
        # This step's own exit code is the "do not commit partial data"
        # gate: refresh_metadata.py exits 1 if it got rate-limited before
        # finishing the batch, which fails this step and skips every step
        # below — nothing gets committed.
        env:
          GITHUB_TOKEN: ${{ secrets.METADATA_REFRESH_TOKEN }}
        run: python build/refresh_metadata.py

      - name: Regenerate README and index.json
        run: python build/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools README.md data/index.json
          if ! git diff --cached --quiet -- data/tools README.md data/index.json; then
            git commit -m "Refresh machine-owned metadata"
            git push
          else
            echo "no metadata changes"
          fi
