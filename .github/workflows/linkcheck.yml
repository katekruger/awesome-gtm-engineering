name: Link check

on:
  schedule:
    - cron: "23 7 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r build/requirements.txt

      - name: Check every URL, file an issue per dead link
        # A broken third-party site is never this workflow's failure — it
        # always exits 0 (see build/linkcheck.py's own docstring for the
        # 429 / hostile-host / 5xx handling). Failures become issues, not
        # a red workflow run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/linkcheck.py

      - name: Commit consecutive-failure state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/.linkcheck-state.json
          if ! git diff --cached --quiet -- build/.linkcheck-state.json; then
            git commit -m "Update link-check state"
            git push
          else
            echo "no state changes"
          fi
